
name: Update live Canberra forecasts

on:
  schedule:
    - cron: "2,22,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-canberra-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow requests lightgbm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare production worktree
        run: |
          git fetch origin live-data
          git worktree add .live-data -B live-data origin/live-data
          git -C .live-data config user.name "github-actions[bot]"
          git -C .live-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect and publish snapshots
        run: |
          python -u src/live/collect_burst.py

