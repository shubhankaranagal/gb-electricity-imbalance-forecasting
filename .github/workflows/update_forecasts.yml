name: Update live Canberra forecasts

on:
  schedule:
    - cron: "*/5 * * * *"

  # Lets us test it manually from GitHub.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-canberra-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow requests lightgbm

      - name: Update forecasts
        run: |
          python src/live/update_forecasts.py

      - name: Commit refreshed production data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/production/live_history.parquet
          git add data/production/live_forecasts.parquet
          git add docs/data/latest_forecasts.json

          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "Update live Canberra forecasts"
            git push
          fi

          